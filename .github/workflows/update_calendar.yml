name: Update Mishawaka Events Calendar

on:
  # 1. Scheduled run: Twice daily at 06:00 and 18:00 UTC
  schedule:
    - cron: '0 6,18 * * *'

  # 2. Inbound Webhook trigger: external services can trigger via GitHub API
  repository_dispatch:
    types: [update-calendar]

  # 3. Manual run trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Scraper & Generate Calendar
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add actual_events.json mishawaka_calendar.ics
          if git diff --staged --quiet; then
            echo "No changes detected in calendar or event listings."
          else
            git commit -m "Auto-update calendar: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
